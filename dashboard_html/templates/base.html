<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NYC Permit Leads{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/navigation.css">
    {% block extra_css %}{% endblock %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    {% from "_site_nav.html" import site_nav with context %}
    {% call site_nav(active_page|default(''), g.user if g.user is defined else none) %}
        {% block nav_actions %}{% endblock %}
    {% endcall %}

    {% block content %}{% endblock %}

    <script src="/static/js/navigation.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
