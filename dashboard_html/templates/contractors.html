<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contractors — NYC Real Estate Intel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="top-nav">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="brand-mark">RE</span>
                NYC Real Estate Intel
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/properties" class="nav-link">Properties</a>
                <a href="/contractors" class="nav-link active">Contractors</a>
            </div>
            <div class="nav-actions">
                <a href="/auth/logout" class="btn btn-icon" title="Log out">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-head">
            <div class="page-head-row">
                <div>
                    <h1>Contractors</h1>
                    <p>Every contractor pulling permits in NYC, with their work history and portfolio.</p>
                </div>
                <div class="head-metric">
                    <div class="stat-value" id="totalContractors">&ndash;</div>
                    <div class="stat-label">Contractors</div>
                </div>
            </div>
        </div>

        <div class="search-section">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="contractorSearch" placeholder="Search by contractor name or license number" />
                <button class="btn-clear" id="clearSearch" style="display: none;" title="Clear search">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="filter-controls">
                <div class="filter-group">
                    <label for="sortBy">Sort</label>
                    <select id="sortBy" class="filter-select" multiple
                        data-multiselect data-compact data-placeholder="Total jobs">
                        <option value="total_jobs">Total jobs</option>
                        <option value="active_jobs">Active jobs</option>
                        <option value="total_value">Total project value</option>
                        <option value="largest_project">Largest project</option>
                        <option value="unique_properties">Properties worked</option>
                        <option value="most_recent_job">Most recent job</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="sortOrder">Order</label>
                    <select id="sortOrder" class="filter-select"
                        data-multiselect data-compact data-placeholder="High to low">
                        <option value="desc">High to low</option>
                        <option value="asc">Low to high</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="contractorsGrid" class="contractors-grid">
            <!-- Skeleton placeholders shown while the first page loads -->
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
                <div class="skeleton-stats">
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
                <div class="skeleton-stats">
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
                <div class="skeleton-stats">
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
                <div class="skeleton-stats">
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
                <div class="skeleton-stats">
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-header">
                    <div class="skeleton-avatar"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line short"></div>
                    </div>
                </div>
                <div class="skeleton-stats">
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                    <div class="skeleton-stat"></div>
                </div>
            </div>
        </div>

        <div id="pagination" class="pagination" style="display: none;">
            <button id="prevPage" class="btn-pagination">
                <i class="fas fa-chevron-left"></i> Previous
            </button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPage" class="btn-pagination">
                Next <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <script src="/static/js/multiselect.js"></script>
    <script src="/static/js/contractors.js"></script>
</body>
</html>
