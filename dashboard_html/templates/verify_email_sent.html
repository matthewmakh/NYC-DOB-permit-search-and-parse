<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    {% include "_theme_init.html" %}
    <title>Account Access - NYC Permit Leads</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="/static/css/mobile.css">
</head>
<body>
    <div class="auth-container centered">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Your account is ready</h1>
            </div>
            
            <div class="verification-content">
                <h2>No email verification needed</h2>
                <p>Accounts are verified automatically:</p>
                <p class="email-display">{{ email }}</p>
                
                <div class="instructions">
                    <p>Sign in to continue. An active subscription or sponsored team access is required.</p>
                </div>
            </div>
            
            <div class="auth-footer">
                <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
